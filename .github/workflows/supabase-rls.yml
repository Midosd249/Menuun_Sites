name: Supabase RLS integration tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-rls.yml"
  push:
    branches:
      - feat/tenant-authorization-rls-tests
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-rls.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-rls-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rls-tests:
    name: Local PostgreSQL RLS / pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        id: supabase-cli
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Start disposable local Supabase database
        run: supabase start -x studio,mailpit,edge-runtime,logflare,vector

      - name: Run database integration tests
        run: >-
          supabase test db --local
          supabase/tests/tenant_authorization.test.sql
          supabase/tests/security_surface.test.sql
          supabase/tests/appointment_authorization.test.sql
          supabase/tests/tenant_surface_authorization.test.sql
          supabase/tests/public_booking_rpc.test.sql

      - name: Stop local Supabase
        if: always() && steps.supabase-cli.outcome == 'success'
        run: supabase stop --no-backup
