name: Static Quality

on:
  push:
  pull_request:

jobs:
  app-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install app dependencies
        id: install-deps
        run: npm install --no-audit --no-fund
      - name: Test platform contracts
        run: npm test
      - name: Typecheck Next.js application
        if: ${{ always() && steps.install-deps.outcome == 'success' }}
        run: npm run typecheck
      - name: Build Next.js application
        if: ${{ always() && steps.install-deps.outcome == 'success' }}
        run: npm run build

  inline-js-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript and local assets
        run: node scripts/check-inline-js.mjs
