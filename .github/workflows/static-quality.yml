name: Static Quality

on:
  push:
  pull_request:

jobs:
  inline-js-and-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check inline JavaScript and local assets
        run: node scripts/check-inline-js.mjs
      - name: Check Supabase browser config syntax
        run: node --check owner/config.js
