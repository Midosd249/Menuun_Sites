name: Browser QA (local Supabase + production build)

on:
  pull_request:
    paths:
      - "app/**"
      - "supabase/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start local Supabase with isolated fixture data
        run: |
          supabase start -x studio,mailpit,edge-runtime,logflare,vector
          supabase status -o env > /tmp/supabase.env
          cat /tmp/supabase.env >> "$GITHUB_ENV"
          . /tmp/supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Build production app
        run: npm run build
      - name: Run Playwright matrix and owner smoke flow
        run: npm run test:e2e
      - name: Upload browser screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menuun-playwright-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
