name: Browser QA (local Supabase + production build)

on:
  pull_request:
    paths:
      - "app/**"
      - "supabase/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - ".github/workflows/browser-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Start local Supabase with isolated fixture data
        run: |
          supabase start -x studio,mailpit,edge-runtime,logflare,vector
          supabase db reset
          supabase status -o env > /tmp/supabase.env
          cat /tmp/supabase.env >> "$GITHUB_ENV"
          . /tmp/supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Verify seeded local Auth fixture can sign in
        run: |
          curl --fail-with-body --silent --show-error \
            "$NEXT_PUBLIC_SUPABASE_URL/auth/v1/token?grant_type=password" \
            -H "apikey: $NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            --data '{"email":"fixture-owner@menuun.test","password":"FixturePass123!"}' \
            | node -e 'let data="";process.stdin.on("data",chunk=>data+=chunk);process.stdin.on("end",()=>{const result=JSON.parse(data);if(!result.access_token)process.exit(1);console.log("Local Auth fixture password sign-in succeeded.")})'
      - name: Build production app
        run: npm run build
      - name: Run blocking public and owner regression tests
        run: npx playwright test tests/e2e/public-responsive.spec.ts tests/e2e/owner-responsive.spec.ts tests/e2e/booking-realtime.spec.ts
      - name: Run advisory owner smoke flows
        if: always()
        continue-on-error: true
        run: npx playwright test tests/e2e/owner-workspace.spec.ts
      - name: Summarize Playwright failures
        if: always()
        run: node scripts/summarize-playwright.mjs
      - name: Upload browser screenshots, traces and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menuun-playwright-${{ github.run_id }}
          path: |
            test-results/**
            playwright-report/**
          if-no-files-found: warn
          retention-days: 14
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
